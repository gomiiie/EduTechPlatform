<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> EduTech - Login </title>
<link rel="stylesheet" href="../../css/login.css">
</head>
<body>

<header id="page-header">
     <h1 class="logo" align="center"> EduTech </h1>
</header>

<div class="form-container" id="login-box">

 <h2 align="center"> Login </h2>
 <p align="center"> Please enter your login details to access your account. Fields marked with * are required. </p>

<form action="login_success_message.html" method="post">

<fieldset>
<legend> Login Details </legend>

<table align="center">

<tr>
 <td> <label for="user_type">User Type *:</label> </td>
 <td>
  <select class="field" id="user_type" name="user_type" required>
   <option value=""> -- Select User Type -- </option>
   <option value="Student"> Student</option>
   <option value="Instructor"> Instructor </option>
   <option value="Admin">Admin </option>
   <option value="Customer Support"> Customer Support </option>
  </select>
 </td>
</tr>

<tr>
<td> <label for="username"> Username / Email *: </label> </td>
<td> <input class="field" type="text" id="username" name="username" size="30" placeholder="Enter your username or email" required> </td>
</tr>

<tr>
 <td> <label for="password">Password *: </label> </td>
 <td> <input class="field" type="password" id="password" name="password" size="30" required> </td>
</tr>
</table>
</fieldset>

<center>
<div class="button-row">
 <input class="btn" type="submit" value="Login">
 <input class="btn btn-secondary" type="reset" value="Clear Form">
 <a class="btn btn-secondary" href="../../commonui/view/homepage.html"> Go Back </a>
</div>
</center>

</form>

</div>

<footer id="page-footer">
 <p> &copy; EduTech Platform. All rights reserved. </p>
</footer>

</body>
</html>
