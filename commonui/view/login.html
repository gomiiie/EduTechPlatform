<!DOCTYPE html>

<html>
    <head>
        <title>EduTech - Login</title>
        <link rel="stylesheet" href="../../css/login.css">
    </head>
    <body>

        <div id = "header">
            <h1>EduTech</h1>
        </div>
        
        <div id = "main">
            <br>
            <h2 class = "center low-top-margin">Login</h2>
            <p class = "center low-top-margin">Back to learn some more? Please enter your login details to access your account. </p>
            <form>
                <fieldset>

                    <div class = "form-group">
                        <label>User Type:</label>
                        <select class = "fillup center" required>
                            <option value=""> -- Select User Type -- </option>
                            <option value="Student">Student</option>
                            <option value="Instructor">Instructor</option>
                            <option value="Admin">Admin</option>
                            <option value="Customer Support">Customer Support</option>
                        </select>
                    </div>

                    <div class = "form-group">
                        <label for="username">Username / Email:</label>
                        <input type="text" class = "fillup" size="30" placeholder="Enter your username or email" required>
                    </div>

                    <div class = "form-group">
                        <label for="password">Password:</label>
                        <input type="password" class = "fillup" id="password" name="password" size="30" required>
                    </div>
                </fieldset>

                <div class = "button-group">
                    <input type="submit" class = "buttons" value="Login">
                    <input type="reset" class = "buttons" value="Clear Form">
                    <a class = "buttons" href="homepage.html">Go Back</a>
                </div>
            </form>
        </div>

        <p id = "footer">© 2026 EduTech. All rights reserved.</p>
    </body>
</html>
