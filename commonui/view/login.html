<!DOCTYPE html>

<title> EduTech Platform - Login </title>

<body>

 <h1 align="center"> EduTech Platform </h1>
 <h2 align="center"> Login </h2>

<form action="login_success_message.html" method="post">

<td align="center">

   <option value="Instructor"> Instructor </option>
   <option value="Admin">Admin </option>
   <option value="Customer Support"> Customer Support </option>
  </select>
 </td>
</tr>

<tr>
<td> <label for="username"> Username / Email *: </label> </td>
<td> <input type="text" id="username" name="username" size="30" placeholder="Enter your username or email" required> </td>
</tr>

<tr>
 <td> <label for="password">Password *: </label> </td>
 <td> <input type="password" id="password" name="password" size="30" required> </td>
</tr>
</table>
</fieldset>
<br>

<input type="submit" value="Login">
<input type="reset" value="Clear Form">

<center>
  <a href="homepage.html">
      <button type="button">Go Back</button>
  </a>
</center>

</td>
</tr>
</table>

</form>
