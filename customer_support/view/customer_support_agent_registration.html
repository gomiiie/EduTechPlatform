<!DOCTYPE html>
<html>
<head>
<title>Customer Support Agent Registration - EduTech Platform</title>
<link rel = "stylesheet" href = "../../css/customer_support.css">
</head>
<body>

<h1>EduTech Platform</h1>
<h2>Customer Support Agent Registration</h2>

<form>

<fieldset>
<legend>Account Details</legend>
<table>
    <tr>
        <td><label>Email:</label></td>
        <td><input type = "email"></td>
        <td><label>Password:</label></td>
        <td><input type = "password"></td>
    </tr>
    <tr>
        <td><label>Confirm Password:</label></td>
        <td><input type = "password"></td>
        <td><label>User Name:</label></td>
        <td><input type = "text"></td>
    </tr>
</table>
</fieldset>
<br>

<fieldset>
<legend>Agent Information</legend>
<table>
    <tr>
        <td><label>Full Name:</label></td>
        <td><input type = "text"></td>
        <td>Gender:</td>
        <td>
            <input type = "radio" name = "gender"> Male
            <input type = "radio" name = "gender"> Female
        </td>
    </tr>
    <tr>
        <td><label>Date of Birth:</label></td>
        <td><input type = "date"></td>
        <td><label>Phone Number:</label></td>
        <td><input type = "text"></td>
    </tr>
    <tr>
        <td><label>Support Area:</label></td>
        <td>
            <select>
                <option>Billing</option>
                <option>Technical</option>
                <option>Course Content</option>
                <option>General</option>
            </select>
        </td>
        <td>Shift:</td>
        <td>
            <input type = "radio" name = "shift"> Morning
            <input type = "radio" name = "shift"> Evening
            <input type = "radio" name = "shift"> Night
        </td>
    </tr>
    <tr>
        <td><label>Qualification:</label></td>
        <td>
            <select>
                <option>SSC</option>
                <option>HSC</option>
                <option>Bachelor</option>
                <option>Master</option>
            </select>
        </td>
        <td><label>GPA:</label></td>
        <td><input type = "text"></td>
    </tr>
    <tr>
        <td><label>Passing Year:</label></td>
        <td><input type = "text"></td>
        <td></td>
        <td></td>
    </tr>
    <tr>
        <td><label>Experience:</label></td>
        <td>
            <select>
                <option>0 Year</option>
                <option>1 Year</option>
                <option>2 Years</option>
                <option>3+ Years</option>
            </select>
        </td>
        <td></td>
        <td></td>
    </tr>
    <tr>
        <td>Skills:</td>
        <td colspan = "3">
            <input type = "checkbox"> Communication
            <input type = "checkbox"> Problem Solving
            <input type = "checkbox"> CRM
        </td>
    </tr>
</table>
</fieldset>
<br>

<fieldset>
<legend>Documents</legend>
<table>
    <tr>
        <td><label>Upload CV:</label></td>
        <td><input type = "file"></td>
        <td><label>Photo:</label></td>
        <td><input type = "file"></td>
    </tr>
</table>
</fieldset>
<br>

<fieldset>
<legend>Confirmation</legend>
<input type = "checkbox"> I confirm all information is accurate and agree to the terms and conditions.
</fieldset>
<br>

<div class = "center">
    <input type = "submit" value = "Apply Now">
    <input type = "reset" value = "Clear Form">
</div>

</form>

</body>
</html>
