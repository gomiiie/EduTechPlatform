<!DOCTYPE html>
<html>
<head>
<title>Customer Support Agent Registration - EduTech Platform</title>
</head>
<body>

<h1 align="center">EduTech Platform</h1>
<h2 align="center">Customer Support Agent Registration</h2>

<form action="/action_page.php" method="post">

<fieldset>
<legend>Account Details</legend>
<table>
<tr>
<td><label for="email">Email: </label></td>
<td><input type="email" id="email" name="email"></td>
<td><label for="password">Password:</label></td>
<td><input type="password" id="password" name="password"></td>
</tr>

<tr>
<td><label for="confirm_password">Confirm Password:</label></td>
<td><input type="password" id="confirm_password" name="confirm_password"></td>
<td><label for="username">User Name:</label></td>
<td><input type="text" id="username" name="username"></td>
</tr>
</table>
</fieldset>
<br>

<fieldset>
<legend>Agent Information</legend>
<table>
<tr>
<td><label for="fullname">Full Name:</label></td>
<td><input type="text" id="fullname" name="fullname"></td>
<td>Gender:</td>
<td>
<input type="radio" id="male" name="gender" value="Male">
<label for="male"> Male </label>
<input type="radio" id="female" name="gender" value="Female">
<label for="female"> Female </label>
</td>
</tr>

<tr>
<td><label for="dob">Date of Birth:</label></td>
<td><input type="date" id="dob" name="dob"></td>
<td><label for="phone">Phone Number:</label></td>
<td><input type="text" id="phone" name="phone"></td>
</tr>

<tr>
<td><label for="support_area">Support Area:</label></td>
<td>
<select id="support_area" name="support_area">
<option value="Billing">Billing</option>
<option value="Technical">Technical</option>
<option value="Course Content">Course Content</option>
<option value="General">General</option>
</select>
</td>
<td>Shift:</td>
<td>
<input type="radio" id="morning" name="shift" value="Morning">
<label for="morning">Morning</label>
<input type="radio" id="evening" name="shift" value="Evening">
<label for="evening">Evening</label>
<input type="radio" id="night" name="shift" value="Night">
<label for="night">Night</label>
</td>
</tr>

<tr>
<td><label for="qualification">Qualification:</label></td>
<td>
<select id="qualification" name="qualification">
<option value="SSC">SSC</option>
<option value="HSC">HSC</option>
<option value="Bachelor">Bachelor</option>
<option value="Master">Master</option>
</select>
</td>
<td><label for="gpa">GPA:</label></td>
<td><input type="text" id="gpa" name="gpa"></td>
</tr>

<tr>
<td><label for="passing_year">Passing Year:</label></td>
<td><input type="text" id="passing_year" name="passing_year"></td>
<td></td>
<td></td>
</tr>

<tr>
<td><label for="experience">Experience:</label></td>
<td>
<select id="experience" name="experience">
<option value="0 Year">0 Year</option>
<option value="1 Year">1 Year</option>
<option value="2 Years">2 Years</option>
<option value="3+ Years">3+ Years</option>
</select>
</td>
<td></td>
<td></td>
</tr>

<tr>
<td>Skills:</td>
<td colspan="3">
<input type="checkbox" id="skill1" name="skill1" value="Communication">
<label for="skill1">Communication</label>
<input type="checkbox" id="skill2" name="skill2" value="Problem Solving">
<label for="skill2">Problem Solving</label>
<input type="checkbox" id="skill3" name="skill3" value="CRM">
<label for="skill3">CRM</label>
</td>
</tr>
</table>
</fieldset>
<br>

<fieldset>
<legend>Documents</legend>
<table>
<tr>
<td><label for="cv">Upload CV:</label></td>
<td><input type="file" id="cv" name="cv"></td>
<td><label for="photo">Photo:</label></td>
<td><input type="file" id="photo" name="photo"></td>
</tr>
</table>
</fieldset>
<br>

<fieldset>
<legend>Confirmation</legend>
<input type="checkbox" id="terms" name="terms" value="Agreed">
<label for="terms"> I confirm all information is accurate and agree to the terms and conditions. </label>
</fieldset>
<br>

<input type="submit" value="Apply Now">
<input type="reset" value="Clear Form">

</form>

</body>
</html>
