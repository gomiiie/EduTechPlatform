<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration</title>
        <link rel="stylesheet" href="../../css/student_registration.css">
    </head>
    <body>
        <h1 class="center">EduTech Platform</h1>
        <h2 class="center">Sign up as a student</h2>
        <p class="center" id="headerpara">Access a wide variety of courses from experienced instructors</h2>
        <form>
            <fieldset>
                <legend>Account Information</legend>
                    <div class = "form-group">
                        <label>Full Name</label>
                        <input type = "text">
                    </div>
                    <div class = "form-group">
                        <label>Email</label>
                        <input type = "email">
                    </div>
                    <div class = "form-group">
                        <label>Password</label>
                        <input type = "password">
                    </div>
                    <div class = "form-group">
                        <label>Confirm Password</label>
                        <input type = "password">
                    </div>
            </fieldset>
            <hr>
            <fieldset>
                <legend>Personal Details</legend>
                <div class = "form-group">
                    <label>Date of Birth</label>
                    <input type = "date">
                </div>
                <div class = "form-group">
                    <label>Phone Number (Optional)</label>
                    <input type = "tel">
                </div>
                <div class = "form-group">
                    <label>Gender</label>
                    <select>
                        <option value = "">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Prefer not to say</option>
                    </select>
                </div>
                <div class = "form-group">
                    <label>Country:</label>
                    <select>
                        <option value = "">Select</option>
                        <option>Bangladesh</option>
                        <option>India</option>
                        <option>Pakistan</option>
                        <option>United States</option>
                        <option>United Kingdom</option>
                        <option>Other</option>
                    </select>
                </div>
            </fieldset>
            <hr>
            <fieldset>
                <legend>Learning Preferences</legend>
                <div class = "form-group">
                    <label>Education Level:</label>
                    <select>
                        <option value = "">Select</option>
                        <option>High School</option>
                        <option>Undergraduate</option>
                        <option>Postgraduate</option>
                        <option>Other</option>
                    </select>
                    <br>
                    <label>Interests:</label>
                    <div class = "checkbox-group">
                        <label class = "cbox"><input type = "checkbox"> Programming</label>
                        <label class = "cbox"><input type = "checkbox"> Design</label>
                    </div>
                    <div class = "checkbox-group">
                        <label class = "cbox"><input type = "checkbox"> Business</label>
                        <label class = "cbox"><input type = "checkbox"> Science</label>
                    </div>
                </div>
            </fieldset>

        <div class = "button-group">
            <input type="submit" value="Submit" id = "btn-login" class = "buttons">
            <input type="reset" value="Reset" id = "btn-reset" class = "buttons">
            <a href="../../commonui/view/homepage.html" id = "btn-back" class = "buttons"> Go Back </a>
        </div>
        </form>
        
        
    </body>
</html>
