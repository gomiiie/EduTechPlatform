<html>
    <head>
        <title>
            Student Registration
        </title>
    </head>
    
    <body>
        <center>
            <h1>EduTech Platform</h1>
            <h2>Sign up as a student</h2>
        </center>
        <h2>Access a wide variety of courses from experienced instructors</h2>
        <form>
            <fieldset>
                <legend>Account Information</legend>

                <table>
                    <tr>
                        <td><label>Full Name:</label></td>
                        <td><input type = "text"></td>
                        <td><label>Email: </label></td>
                        <td><input type = "email"></td>
                    </tr>
                    <tr>
                        <td><label>Password:</label></td>
                        <td><input type = "password"></td>
                        <td><label>Confirm Password:</label></td>
                        <td><input type = "password"></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Personal Details</legend>

                <table>
                    <tr>
                        <td><label>Date of Birth:</label></td>
                        <td><input type = "date"></td>
                        <td><label>Phone Number (Optional):</label></td>
                        <td><input type = "tel"></td>
                    </tr>
                    <tr>
                        <td><label>Gender:</label></td>
                        <td>
                            <select>
                                <option value = "">Select</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Prefer not to say</option>
                            </select>
                        </td>
                        <td><label>Country:</label></td>
                        <td>
                            <select>
                                <option value = "">Select</option>
                                <option>Bangladesh</option>
                                <option>India</option>
                                <option>Pakistan</option>
                                <option>United States</option>
                                <option>United Kingdom</option>
                                <option>Other</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Learning Preferences</legend>

                <table>
                    <tr>
                        <td><label>Education Level:</label></td>
                        <td>
                            <select>
                                <option value = "">Select</option>
                                <option>High School</option>
                                <option>Undergraduate</option>
                                <option>Postgraduate</option>
                                <option>Other</option>
                            </select>
                        </td>
                        <td><label>Interests:</label></td>
                        <td>
                            <label><input type = "checkbox"> Programming</label>
                            <label><input type = "checkbox"> Design</label>
                            <label><input type = "checkbox"> Business</label>
                            <label><input type = "checkbox"> Science</label>
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
        <center>
            <input type="submit" value="Apply Now" >
            <input type="reset" value="Reset">
            <a href="../commonui/homepage.html">
                <button type="button">Go Back</button>
            </a>
        </center>
    </body>
</html>
